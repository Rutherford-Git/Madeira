# Builds Madeira from this repository's source (docs/BUILDING.md), then signs
# it with sign-ipa.yml for the iPhones in your development profiles.
#
#   dxmt    LLVM for iOS (cached after the first run, which takes about an
#           hour) and DXMT's unix side -> libdxmt_combined.a
#   native  GnuTLS headers, FFmpeg, FreeType, the configured Wine tree, Wine's
#           unix side (ntdll, wineserver, win32u), in-app pairing (Rust), the
#           ignored aarch64 service programs and Madeira Dock
#   wow64   the i386 farm for 32-bit programs (cached; a whole Wine build)
#   app     FEX for iOS and the Xcode app (Debug: the configuration that runs
#           games), packaged as an unsigned IPA
#   sign    sign-ipa.yml, optionally publishing the install page
#
# The other Windows-side DLLs (app/Madeira/arm64ec-windows and aarch64-windows)
# are the ones committed in the repository; this does not rebuild them.
name: Build from source

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle ID of your App ID (the JIT helper is <bundle_id>.JITHelper)
        default: com.rutherfordgit.madeira
      publish:
        description: Publish an install page for the registered iPhones
        type: boolean
        default: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  LLVM_MINGW_DIST: llvm-mingw-20260421-ucrt-macos-universal
  LLVM_MINGW_DIST_SHA256: bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7

jobs:
  dxmt:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: DXMT submodule
        run: git submodule update --init --recursive --depth 1 dxmt

      - name: Restore LLVM for iOS
        id: llvm
        uses: actions/cache/restore@v6
        with:
          path: |
            toolchains/llvm-ios-build/lib
            toolchains/llvm-ios-build/include
            toolchains/llvm-project/llvm/include
          key: llvm-ios-${{ hashFiles('.github/ci/build-llvm-ios.sh') }}-xcode26.6

      - name: Build LLVM for iOS
        if: steps.llvm.outputs.cache-hit != 'true'
        run: bash .github/ci/build-llvm-ios.sh

      - name: Save LLVM for iOS
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            toolchains/llvm-ios-build/lib
            toolchains/llvm-ios-build/include
            toolchains/llvm-project/llvm/include
          key: ${{ steps.llvm.outputs.cache-primary-key }}

      - name: Metal toolchain
        # Xcode 26 downloads the Metal compiler separately; DXMT compiles its
        # command shaders with it.
        run: xcodebuild -downloadComponent MetalToolchain

      - name: DXMT's AIR shader headers
        run: bash .github/ci/dxmt-air-headers.sh

      - name: DXMT unix side
        run: bash build/dxmt-ios/build.sh || { for f in build/dxmt-ios/obj/*.err; do [ -s "$f" ] && grep -q "error:" "$f" && { echo "== $f"; grep -B2 -A6 "error:" "$f" | head -60; }; done; exit 1; }

      - name: Combine with LLVM
        run: bash .github/ci/combine-dxmt.sh

      - uses: actions/upload-artifact@v7
        with:
          name: lib-dxmt
          path: app/Madeira/libdxmt_combined.a
          retention-days: 7

  native:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Wine and Madeira Dock submodules
        run: git submodule update --init --depth 1 wine madeira-dock

      - name: Host tools
        run: |
          brew install bison gnutls freetype pkgconf
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          # llvm-objcopy for build/wineserver/build.sh's symbol renames, without
          # putting Homebrew's clang ahead of Xcode's.
          mkdir -p "$HOME/llvm-tools"
          ln -sf "$(brew --prefix llvm@20)/bin/llvm-objcopy" "$HOME/llvm-tools/llvm-objcopy"
          echo "$HOME/llvm-tools" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios

      - name: llvm-mingw
        run: |
          curl -fsSL --retry 3 -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/$LLVM_MINGW_DIST.tar.xz"
          echo "$LLVM_MINGW_DIST_SHA256  /tmp/llvm-mingw.tar.xz" | shasum -a 256 -c
          mkdir -p toolchains
          tar -xJf /tmp/llvm-mingw.tar.xz -C toolchains

      # Each piece runs on even if one before it failed, so one run shows every
      # failure; the last step stops the job when anything is missing.
      - name: GnuTLS (headers for the crypto unix libraries)
        continue-on-error: true
        run: bash build/gnutls-ios/build.sh

      - name: FFmpeg
        continue-on-error: true
        run: bash build/ffmpeg/build.sh || { tail -40 build/ffmpeg/obj/*.log; exit 1; }

      - name: FreeType
        continue-on-error: true
        run: |
          git clone -q --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
          bash build/freetype-ios/build.sh

      - name: Configure Wine
        continue-on-error: true
        run: bash .github/ci/configure-wine.sh

      - name: ntdll unix side
        continue-on-error: true
        run: bash build/ntdll-unix/build.sh || { for f in build/ntdll-unix/obj/*.err; do [ -s "$f" ] && { echo "== $f"; head -20 "$f"; }; done; exit 1; }

      - name: wineserver
        continue-on-error: true
        run: |
          bash .github/ci/wineserver-base.sh
          bash build/wineserver/build.sh || { for f in build/wineserver/obj/err-*.txt; do [ -s "$f" ] && { echo "== $f"; head -20 "$f"; }; done; exit 1; }

      - name: win32u unix side
        continue-on-error: true
        run: bash build/win32u-unix/build.sh || { for f in build/win32u-unix/obj/*.err; do [ -s "$f" ] && { echo "== $f"; head -20 "$f"; }; done; exit 1; }

      - name: In-app pairing (Rust)
        continue-on-error: true
        run: bash build/rppairing-ios/build.sh

      - name: Wine's aarch64 service programs
        continue-on-error: true
        run: bash .github/ci/wine-aarch64-programs.sh

      - name: Madeira Dock (starts Steam games through Valve's client)
        continue-on-error: true
        run: bash build/madeira-dock/build.sh

      - name: Everything the app needs from here is built
        run: |
          missing=0
          for f in libntdll_unix.a libwineserver.a libwin32u_unix.a libmadeira_rppairing.a \
                   libavformat.a libavcodec.a libswresample.a libavutil.a \
                   aarch64-windows/winedevice.exe aarch64-windows/svchost.exe \
                   aarch64-windows/plugplay.exe arm64ec-windows/dockhost.exe; do
            if [ -f "app/Madeira/$f" ]; then
              echo "ok      $f ($(wc -c < "app/Madeira/$f" | tr -d ' ') bytes)"
            else
              echo "::error::app/Madeira/$f was not built"; missing=1
            fi
          done
          exit $missing

      - uses: actions/upload-artifact@v7
        with:
          name: lib-native
          path: |
            app/Madeira/libntdll_unix.a
            app/Madeira/libwineserver.a
            app/Madeira/libwin32u_unix.a
            app/Madeira/libmadeira_rppairing.a
            app/Madeira/libavformat.a
            app/Madeira/libavcodec.a
            app/Madeira/libswresample.a
            app/Madeira/libavutil.a
            app/Madeira/legal/LICENSES-rppairing-crates.txt
            app/Madeira/aarch64-windows/winedevice.exe
            app/Madeira/aarch64-windows/svchost.exe
            app/Madeira/aarch64-windows/plugplay.exe
            app/Madeira/arm64ec-windows/dockhost.exe
            app/Madeira/arm64ec-windows/dock-notices.txt
          retention-days: 7

  # The 32-bit Windows farm WoW64 sessions load (docs/WOW64.md): every i386
  # Wine module plus DXMT's i386 DLLs. A whole Wine build, so it is cached on
  # the Wine and DXMT commits and the script that builds it.
  wow64:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Cache key
        id: key
        run: echo "key=i386-farm-$(git rev-parse HEAD:wine)-$(git rev-parse HEAD:dxmt)-${{ hashFiles('build/wine-i386/build.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the i386 farm
        id: farm
        uses: actions/cache/restore@v6
        with:
          path: app/Madeira/i386-windows
          key: ${{ steps.key.outputs.key }}

      - name: Wine and DXMT submodules
        if: steps.farm.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 wine
          git submodule update --init --recursive --depth 1 dxmt

      - name: Host tools
        if: steps.farm.outputs.cache-hit != 'true'
        run: |
          brew install bison meson
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: llvm-mingw
        if: steps.farm.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/$LLVM_MINGW_DIST.tar.xz"
          echo "$LLVM_MINGW_DIST_SHA256  /tmp/llvm-mingw.tar.xz" | shasum -a 256 -c
          mkdir -p toolchains
          tar -xJf /tmp/llvm-mingw.tar.xz -C toolchains

      - name: i386 farm
        if: steps.farm.outputs.cache-hit != 'true'
        run: bash build/wine-i386/build.sh || { grep -E "error:|Error " wine/build-i386/madeira-i386-build.log | head -60; exit 1; }

      - name: Save the i386 farm
        if: steps.farm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/Madeira/i386-windows
          key: ${{ steps.key.outputs.key }}

      - uses: actions/upload-artifact@v7
        with:
          name: farm-i386
          path: app/Madeira/i386-windows
          retention-days: 7

  app:
    needs: [dxmt, native, wow64]
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - name: FEX submodule
        run: git submodule update --init --recursive --depth 1 FEX

      - uses: actions/download-artifact@v8
        with:
          pattern: lib-*
          path: app/Madeira
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: farm-i386
          path: app/Madeira/i386-windows

      - name: FEX for iOS
        run: |
          # CMake 4 leaves CMAKE_SYSTEM_PROCESSOR empty for an iOS cross build,
          # and FEX's CMakeLists rejects an empty processor. Its default
          # TUNE_CPU=native reads the build host's /proc/cpuinfo, which macOS
          # lacks (and the host is not the iPhone): tune for the A13, the oldest
          # chip iOS 26 runs on. Same script, with both set.
          sed 's/-DCMAKE_SYSTEM_NAME=iOS /-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64 -DTUNE_CPU=apple-a13 /' \
            build/fex-ios/build.sh > build/fex-ios/build-ci.sh
          grep -q CMAKE_SYSTEM_PROCESSOR=arm64 build/fex-ios/build-ci.sh
          bash build/fex-ios/build-ci.sh
          # The app also links libJemallocLibs.a, a target of its own that the
          # script's FEXCore targets do not pull in.
          cmake --build FEX/build-ios --target JemallocLibs
          ls FEX/build-ios/FEXCore/Source/libJemallocLibs.a

      - name: Inputs the project expects
        run: |
          # The app's .metal sources need Xcode 26's separately downloaded compiler.
          xcodebuild -downloadComponent MetalToolchain
          # The VC++ runtime is Microsoft's and not redistributed here; the
          # project's folder reference only needs the folder.
          mkdir -p app/Madeira/x86_64-vcruntime
          bash build/stage-licenses.sh

      - name: Build the app (Debug)
        run: |
          set -o pipefail
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: unable|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/xcodebuild.log || { grep -B2 -A8 "error:" build/xcodebuild.log | head -150; exit 1; }

      - name: Package the unsigned IPA
        run: |
          app=build/DerivedData/Build/Products/Debug-iphoneos/Madeira.app
          rm -rf Payload && mkdir Payload && cp -R "$app" Payload/
          rm -rf Payload/Madeira.app/wine-mono
          zip -qry -9 Madeira-unsigned.ipa Payload
          ls -l Madeira-unsigned.ipa

      - id: label
        run: echo "label=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: Madeira-unsigned
          path: Madeira-unsigned.ipa
          compression-level: 0
          retention-days: 7

  sign:
    needs: app
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/sign-ipa.yml
    with:
      ipa_artifact: Madeira-unsigned
      label: ${{ needs.app.outputs.label }}
      bundle_id: ${{ inputs.bundle_id }}
      publish: ${{ inputs.publish }}
    secrets: inherit
